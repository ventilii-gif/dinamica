<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1976d2"/>
      <stop offset="1" stop-color="#0d47a1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- pivot triangle -->
  <polygon points="256,140 200,210 312,210" fill="#fff"/>
  <!-- vertical post -->
  <rect x="248" y="200" width="16" height="160" fill="#fff"/>
  <!-- base -->
  <rect x="180" y="350" width="152" height="22" rx="6" fill="#fff"/>
  <!-- horizontal beam -->
  <rect x="100" y="218" width="312" height="14" rx="6" fill="#fff"/>
  <!-- left chain -->
  <line x1="130" y1="232" x2="130" y2="280" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <line x1="382" y1="232" x2="382" y2="280" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <!-- left pan -->
  <path d="M 90 280 Q 130 320 170 280 Z" fill="#ffd54f" stroke="#fff" stroke-width="4"/>
  <!-- right pan -->
  <path d="M 342 280 Q 382 320 422 280 Z" fill="#ff7043" stroke="#fff" stroke-width="4"/>
</svg>
